<!DOCTYPE html> 
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEXTBOOK PLATFORM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; background-color: #ECECEC; color: #000000; }
    .card-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
    .hero-svg-title { width: 100%; height: auto; display: block; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6">

  <div class="max-w-[1400px] w-full mx-auto bg-[#F7F7F7] rounded-[32px] overflow-hidden shadow-2xl border border-white/80 flex flex-col justify-between">
    
    <!-- Navigation Bar (ซ่อนข้อความและโลโก้ใน iPad ทั้งแนวตั้งและแนวนอน แสดงเฉพาะ xl ขึ้นไป) -->
    <nav class="px-6 md:px-10 py-6 flex items-center justify-center xl:justify-between border-b border-gray-200/50">
      <div id="nav-logo" class="hidden xl:flex items-center gap-3 w-auto justify-start">
        <img id="nav-logo-img" src="logo-A.png" alt="Logo" referrerpolicy="no-referrer" class="w-8 h-8 md:w-9 md:h-9 object-cover rounded-full"/>
        <span id="nav-logo-text" class="font-black text-lg md:text-xl tracking-wider text-black">School of Engineering</span>
      </div>
      
      <!-- ซ่อนในหน้าจอขนาดเล็ก iPad แนวตั้ง/แนวนอน (แสดงเฉพาะ xl ขึ้นไป) -->
      <div id="nav-dynamic-links" class="hidden xl:flex items-center gap-8 text-xs font-bold tracking-widest uppercase text-gray-500"></div>
    </nav>

    <!-- Public Page Content -->
    <div id="public-page" class="space-y-12 md:space-y-16 pb-12">
      <!-- HERO SECTION -->
      <section class="relative pt-16 md:pt-28 pb-6 px-3 md:px-8 flex flex-col items-center justify-center overflow-hidden">
        <div class="w-full">
          <svg class="hero-svg-title" viewBox="0 0 1000 128" preserveAspectRatio="none">
            <text id="hero-big-text-svg" x="50%" y="108" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="142" fill="#000000" letter-spacing="-3">TEXTBOOK</text>
          </svg>
        </div>
        <p id="hero-subtext" class="text-[10px] md:text-[11px] uppercase tracking-[0.35em] font-bold text-gray-400 text-center my-3 md:my-2"></p>
        <div class="relative w-full max-w-xl mx-auto z-10 my-2">
          <img id="hero-img" src="" alt="Hero" referrerpolicy="no-referrer" class="w-56 h-56 md:w-[360px] md:h-[360px] object-cover mx-auto rounded-full shadow-2xl border-4 border-white/90"/>
        </div>
        <div class="w-full text-center mt-6 z-10 px-4 space-y-2 overflow-x-auto">
          <p id="hero-bottom-title" class="text-xs font-bold uppercase tracking-[0.25em] text-gray-800"></p>
          <p id="hero-desc-left" class="text-xs text-gray-500 font-normal leading-relaxed whitespace-nowrap inline-block"></p>
        </div>
      </section>

      <!-- ABOUT SECTION -->
      <section class="px-6 md:px-16 max-w-5xl mx-auto pt-8 pb-4 border-t border-gray-200/60">
        <div class="text-center mb-6">
          <h2 id="about-title" class="text-xl md:text-2xl font-black tracking-wider text-black"></h2>
          <p id="about-subtitle" class="text-[11px] tracking-widest text-gray-400 mt-0.5 font-semibold"></p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 text-xs text-gray-600 leading-relaxed font-normal">
          <p id="about-text-1"></p>
          <p id="about-text-2"></p>
        </div>
      </section>

      <!-- SYSTEM COLLECTION -->
      <section class="px-6 md:px-12 max-w-6xl mx-auto pt-4 pb-6">
        <div class="text-center mb-8 border-b border-gray-200/60 pb-6">
          <h2 id="system-title" class="text-xl md:text-2xl font-black tracking-tight text-black"></h2>
          <p id="system-subtitle" class="text-[11px] font-semibold text-gray-400 tracking-widest mt-1"></p>
        </div>
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>
    </div>

    <!-- Footer -->
    <footer id="main-footer" class="px-6 md:px-8 py-6 border-t border-gray-200/60 flex flex-col xl:flex-row justify-center xl:justify-between items-center text-[11px] font-medium text-gray-400 uppercase tracking-widest gap-4">
      <div id="footer-copyright" class="text-center leading-relaxed overflow-x-auto w-full xl:w-auto xl:text-left">
        <span class="block md:inline">© 2026 งานเทคโนโลยีการศึกษา คณะวิศวกรรมศาสตร์</span>
        <span class="block md:inline md:ml-1">สถาบันเทคโนโลยีพระจอมเกล้าเจ้าคุณทหารลาดกระบัง</span>
      </div>
      <div id="footer-links-container" class="hidden xl:flex gap-6"></div>
    </footer>

  </div>

  <script>
    // 🔗 ตั้งค่า Supabase Credentials
    const SUPABASE_URL = 'https://dvzzpuorytdvdawolken.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TK-m_pMcUSnq9h2Lf1T3bQ_bUrSpd4H';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function extractGoogleDriveId(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const matches = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return (matches && matches[1]) ? matches[1] : null;
    }

    function parseGoogleDriveUrl(url) {
      if (!url) return '';
      const cleanUrl = url.trim();
      if (cleanUrl.includes('drive.google.com') || cleanUrl.includes('docs.google.com')) {
        const fileId = extractGoogleDriveId(cleanUrl);
        if (fileId) {
          // ใช้ Googleusercontent CDN โดยตรงเพื่อให้ iOS / iPadOS Safari โหลดได้โดยไม่ติด ITP Redirect Block
          return `https://lh3.googleusercontent.com/d/${fileId}=s1200`;
        }
      }
      return cleanUrl;
    }

    function handleDriveImgFallback(imgElement, originalUrl) {
      if (!originalUrl) return;
      const fileId = extractGoogleDriveId(originalUrl);
      if (!fileId) return;

      const step = parseInt(imgElement.dataset.fallbackStep || '0', 10);
      if (step === 0) {
        imgElement.dataset.fallbackStep = '1';
        imgElement.src = `https://lh3.googleusercontent.com/d/${fileId}`;
      } else if (step === 1) {
        imgElement.dataset.fallbackStep = '2';
        // Proxy สำรองกรณี iOS Safari บล็อก Google Drive Cookie
        imgElement.src = `https://wsrv.nl/?url=${encodeURIComponent('https://drive.google.com/uc?export=view&id=' + fileId)}`;
      }
    }

    // ฟังก์ชันจับคู่ไอคอน (แสดงไอคอนเครื่องหมายถูกในวงกลมเหมือนกันทุกเมนู)
    function getAutoIconSvg(label) {
      return `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
    }

    // ดึงข้อมูลจาก Supabase มาแสดงผลบนหน้าเว็บ
    async function loadDataFromSupabase() {
      const { data, error } = await supabaseClient
        .from('site_config')
        .select('content')
        .eq('id', 1)
        .single();

      if (error || !data) {
        console.error('Error fetching data:', error);
        return;
      }

      const c = data.content;

      // 1. Header & Nav
      if (c.logoUrl) {
        const navLogoImg = document.getElementById('nav-logo-img');
        navLogoImg.onerror = () => handleDriveImgFallback(navLogoImg, c.logoUrl);
        navLogoImg.src = parseGoogleDriveUrl(c.logoUrl);
      }
      document.getElementById('nav-logo-text').innerText = c.logoText || 'School of Engineering';
      document.getElementById('nav-dynamic-links').innerHTML = (c.navMenuItems || []).map(item => 
        `<a href="${item.url}" target="_blank" class="flex items-center gap-1.5 hover:text-black transition">
          ${getAutoIconSvg(item.label)}
          <span>${item.label}</span>
        </a>`
      ).join('');

      // 2. Hero Section
      document.getElementById('hero-big-text-svg').textContent = c.heroBigTitle || 'TEXTBOOK';
      document.getElementById('hero-subtext').innerText = c.heroSubtext || '';
      document.getElementById('hero-bottom-title').innerText = c.heroBottomTitle || '';
      document.getElementById('hero-desc-left').innerText = c.heroDescLeft || '';
      if (c.heroImgUrl) {
        const heroImg = document.getElementById('hero-img');
        heroImg.onerror = () => handleDriveImgFallback(heroImg, c.heroImgUrl);
        heroImg.src = parseGoogleDriveUrl(c.heroImgUrl);
      }

      // 3. About Section
      document.getElementById('about-title').innerText = c.aboutTitle || '';
      document.getElementById('about-subtitle').innerText = c.aboutSubtitle || '';
      document.getElementById('about-text-1').innerText = c.aboutText1 || '';
      document.getElementById('about-text-2').innerText = c.aboutText2 || '';

      // 4. Cards Section
      document.getElementById('system-title').innerText = c.systemTitle || '';
      document.getElementById('system-subtitle').innerText = c.systemSubtitle || '';
      document.getElementById('cards-container').innerHTML = (c.systemCards || []).map(card => {
        const parsedImg = parseGoogleDriveUrl(card.imageUrl);
        const safeOriginalUrl = (card.imageUrl || '').replace(/'/g, "\\'");
        const imageContent = parsedImg 
          ? `<img src="${parsedImg}" alt="${card.title}" referrerpolicy="no-referrer" onerror="handleDriveImgFallback(this, '${safeOriginalUrl}')" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"/>`
          : `<span class="text-xl md:text-2xl font-black tracking-widest ${card.iconColor}">${card.iconText || 'SYSTEM'}</span>`;

        return `
          <div class="bg-white rounded-[28px] p-6 flex flex-col justify-between card-shadow border border-gray-100 group hover:-translate-y-1.5 transition duration-300">
            <div>
              <h3 class="text-xl font-bold tracking-tight text-black mt-1">${card.title}</h3>
              <p class="text-xs text-gray-500 mt-1.5 leading-snug line-clamp-2">${card.desc}</p>
            </div>
            <div class="my-4 flex justify-center items-center h-48 md:h-52 bg-[#F9F9F9] overflow-hidden border border-gray-100 relative">
              ${imageContent}
            </div>
            <a href="${card.link}" target="_blank" class="w-full py-2.5 bg-black text-white rounded-full text-xs font-bold tracking-widest uppercase text-center hover:bg-gray-800 transition">
              EXPLORE →
            </a>
          </div>
        `;
      }).join('');

      // 5. Footer Section
      if (c.footerCopyright) {
        document.getElementById('footer-copyright').innerHTML = `
          <span class="block md:inline">${c.footerCopyright}</span>
          <span class="block md:inline md:ml-1">สถาบันเทคโนโลยีพระจอมเกล้าเจ้าคุณทหารลาดกระบัง</span>
        `;
      }

      const footerLinks = c.footerLinks || [];
      const mainFooter = document.getElementById('main-footer');
      const copyrightElem = document.getElementById('footer-copyright');

      // ตรวจสอบและปรับให้จัดกลางอัตโนมัติหากไม่มีเมนู Footer ใน PC
      if (footerLinks.length === 0) {
        mainFooter.classList.remove('xl:justify-between');
        mainFooter.classList.add('xl:justify-center');
        copyrightElem.classList.remove('xl:text-left', 'xl:w-auto');
        copyrightElem.classList.add('xl:text-center', 'xl:w-full');
      } else {
        mainFooter.classList.remove('xl:justify-center');
        mainFooter.classList.add('xl:justify-between');
        copyrightElem.classList.remove('xl:text-center', 'xl:w-full');
        copyrightElem.classList.add('xl:text-left', 'xl:w-auto');
      }

      document.getElementById('footer-links-container').innerHTML = footerLinks.map(item => 
        `<a href="${item.url}" target="_blank" class="flex items-center gap-1.5 hover:text-black transition">
          ${getAutoIconSvg(item.label)}
          <span>${item.label}</span>
        </a>`
      ).join('');
    }

    loadDataFromSupabase();
  </script>
</body>
</html>
