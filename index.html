<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEXTBOOK PLATFORM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; background-color: #ECECEC; color: #000000; }
    .card-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
    .hero-svg-title { width: 100%; height: auto; display: block; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6">

  <div class="max-w-[1400px] w-full mx-auto bg-[#F7F7F7] rounded-[32px] overflow-hidden shadow-2xl border border-white/80 flex flex-col justify-between">
    
    <!-- Navigation Bar -->
    <nav class="px-6 md:px-10 py-6 flex items-center justify-between border-b border-gray-200/50">
      <div id="nav-logo" class="flex items-center gap-3">
        <img id="nav-logo-img" src="logo.png" alt="Logo" class="w-8 h-8 md:w-9 md:h-9 object-contain rounded-lg"/>
        <span id="nav-logo-text" class="font-black text-lg md:text-xl tracking-wider text-black">EDUCATION TECHNOLOGY</span>
      </div>
      
      <!-- ซ่อนในหน้าจอขนาดเล็กและแนวตั้ง/แนวนอนของ iPad (แสดงเฉพาะ lg ขึ้นไป) -->
      <div id="nav-dynamic-links" class="hidden lg:flex items-center gap-8 text-xs font-bold tracking-widest uppercase text-gray-500"></div>
    </nav>

    <!-- Public Page Content -->
    <div id="public-page" class="space-y-12 md:space-y-16 pb-12">
      <!-- HERO SECTION -->
      <section class="relative pt-16 md:pt-28 pb-6 px-3 md:px-8 flex flex-col items-center justify-center overflow-hidden">
        <div class="w-full">
          <svg class="hero-svg-title" viewBox="0 0 1000 128" preserveAspectRatio="none">
            <text id="hero-big-text-svg" x="50%" y="108" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="142" fill="#000000" letter-spacing="-3">TEXTBOOK</text>
          </svg>
        </div>
        <p id="hero-subtext" class="text-[10px] md:text-[11px] uppercase tracking-[0.35em] font-bold text-gray-400 text-center my-3 md:my-2"></p>
        <div class="relative w-full max-w-xl mx-auto z-10 my-2">
          <img id="hero-img" src="" alt="Hero" class="w-56 h-56 md:w-[360px] md:h-[360px] object-cover mx-auto rounded-full shadow-2xl border-4 border-white/90"/>
        </div>
        <div class="w-full text-center mt-6 z-10 px-4 space-y-2 overflow-x-auto">
          <p id="hero-bottom-title" class="text-xs font-bold uppercase tracking-[0.25em] text-gray-800"></p>
          <p id="hero-desc-left" class="text-xs text-gray-500 font-normal leading-relaxed whitespace-nowrap inline-block"></p>
        </div>
      </section>

      <!-- ABOUT SECTION -->
      <section class="px-6 md:px-16 max-w-5xl mx-auto pt-8 pb-4 border-t border-gray-200/60">
        <div class="text-center mb-6">
          <h2 id="about-title" class="text-xl md:text-2xl font-black uppercase tracking-wider text-black"></h2>
          <p id="about-subtitle" class="text-[11px] tracking-widest text-gray-400 uppercase mt-0.5 font-semibold"></p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 text-xs text-gray-600 leading-relaxed font-normal">
          <p id="about-text-1"></p>
          <p id="about-text-2"></p>
        </div>
      </section>

      <!-- SYSTEM COLLECTION -->
      <section class="px-6 md:px-12 max-w-6xl mx-auto pt-4 pb-6">
        <div class="text-center mb-8 border-b border-gray-200/60 pb-6">
          <h2 id="system-title" class="text-xl md:text-2xl font-black uppercase tracking-tight text-black"></h2>
          <p id="system-subtitle" class="text-[11px] font-semibold text-gray-400 tracking-widest uppercase mt-1"></p>
        </div>
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="px-6 md:px-8 py-6 border-t border-gray-200/60 flex flex-col xl:flex-row justify-center xl:justify-between items-center text-[11px] font-medium text-gray-400 uppercase tracking-widest gap-4">
      <!-- ข้อความ Copyright: แนวตั้งอยู่แถวเดียวกัน / แนวนอนจัดตรงกลาง / จอใหญ่จัดซ้ายตามเดิม -->
      <div id="footer-copyright" class="text-center leading-relaxed whitespace-nowrap overflow-x-auto w-full xl:w-auto xl:text-left">
        <span class="inline">© 2026 งานเทคโนโลยีการศึกษา คณะวิศวกรรมศาสตร์</span>
        <span class="inline ml-1">สถาบันเทคโนโลยีพระจอมเกล้าเจ้าคุณทหารลาดกระบัง</span>
      </div>
      <!-- ซ่อนลิงก์เฉพาะในมือถือและ iPad ทั้งแนวตั้งและแนวนอน (แสดงเฉพาะจอใหญ่ xl ขึ้นไป) -->
      <div id="footer-links-container" class="hidden xl:flex gap-6"></div>
    </footer>

  </div>

  <script>
    // 🔗 ตั้งค่า Supabase Credentials
    const SUPABASE_URL = 'https://dvzzpuorytdvdawolken.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TK-m_pMcUSnq9h2Lf1T3bQ_bUrSpd4H';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function parseGoogleDriveUrl(url) {
      if (!url) return '';
      if (url.includes('drive.google.com')) {
        const matches = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (matches && matches[1]) return `https://lh3.googleusercontent.com/d/${matches[1]}`;
      }
      return url;
    }

    // ฟังก์ชันจับคู่ไอคอนอัตโนมัติตามชื่อข้อความ
    function getAutoIconSvg(label) {
      const text = (label || '').toLowerCase();
      if (text.includes('ติดตาม') || text.includes('สถานะ') || text.includes('track') || text.includes('status')) {
        return `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
      } else if (text.includes('คำนวณ') || text.includes('ราคา') || text.includes('calc') || text.includes('price')) {
        return `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>`;
      } else if (text.includes('สืบค้น') || text.includes('ค้นหา') || text.includes('search')) {
        return `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>`;
      } else {
        return `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>`;
      }
    }

    // ดึงข้อมูลจาก Supabase มาแสดงผลบนหน้าเว็บ
    async function loadDataFromSupabase() {
      const { data, error } = await supabaseClient
        .from('site_config')
        .select('content')
        .eq('id', 1)
        .single();

      if (error || !data) {
        console.error('Error fetching data:', error);
        return;
      }

      const c = data.content;

      // 1. Header & Nav
      if (c.logoUrl) document.getElementById('nav-logo-img').src = parseGoogleDriveUrl(c.logoUrl);
      document.getElementById('nav-logo-text').innerText = c.logoText || 'EDUCATION TECHNOLOGY';
      document.getElementById('nav-dynamic-links').innerHTML = (c.navMenuItems || []).map(item => 
        `<a href="${item.url}" target="_blank" class="flex items-center gap-1.5 hover:text-black transition">
          ${getAutoIconSvg(item.label)}
          <span>${item.label}</span>
        </a>`
      ).join('');

      // 2. Hero Section
      document.getElementById('hero-big-text-svg').textContent = c.heroBigTitle || 'TEXTBOOK';
      document.getElementById('hero-subtext').innerText = c.heroSubtext || '';
      document.getElementById('hero-bottom-title').innerText = c.heroBottomTitle || '';
      document.getElementById('hero-desc-left').innerText = c.heroDescLeft || '';
      if (c.heroImgUrl) document.getElementById('hero-img').src = parseGoogleDriveUrl(c.heroImgUrl);

      // 3. About Section
      document.getElementById('about-title').innerText = c.aboutTitle || '';
      document.getElementById('about-subtitle').innerText = c.aboutSubtitle || '';
      document.getElementById('about-text-1').innerText = c.aboutText1 || '';
      document.getElementById('about-text-2').innerText = c.aboutText2 || '';

      // 4. Cards Section
      document.getElementById('system-title').innerText = c.systemTitle || '';
      document.getElementById('system-subtitle').innerText = c.systemSubtitle || '';
      document.getElementById('cards-container').innerHTML = (c.systemCards || []).map(card => {
        const parsedImg = parseGoogleDriveUrl(card.imageUrl);
        const imageContent = parsedImg 
          ? `<img src="${parsedImg}" alt="${card.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"/>`
          : `<span class="text-xl md:text-2xl font-black tracking-widest ${card.iconColor}">${card.iconText || 'SYSTEM'}</span>`;

        return `
          <div class="bg-white rounded-[28px] p-6 flex flex-col justify-between card-shadow border border-gray-100 group hover:-translate-y-1.5 transition duration-300">
            <div>
              <h3 class="text-xl font-bold uppercase tracking-tight text-black mt-1">${card.title}</h3>
              <p class="text-xs text-gray-500 mt-1.5 leading-snug line-clamp-2">${card.desc}</p>
            </div>
            <div class="my-4 flex justify-center items-center h-48 md:h-52 bg-[#F9F9F9] overflow-hidden border border-gray-100 relative">
              ${imageContent}
            </div>
            <a href="${card.link}" target="_blank" class="w-full py-2.5 bg-black text-white rounded-full text-xs font-bold tracking-widest uppercase text-center hover:bg-gray-800 transition">
              EXPLORE →
            </a>
          </div>
        `;
      }).join('');

      // 5. Footer Section
      if (c.footerCopyright) {
        document.getElementById('footer-copyright').innerHTML = `
          <span class="inline">${c.footerCopyright}</span>
          <span class="inline ml-1">สถาบันเทคโนโลยีพระจอมเกล้าเจ้าคุณทหารลาดกระบัง</span>
        `;
      }
      document.getElementById('footer-links-container').innerHTML = (c.footerLinks || []).map(item => 
        `<a href="${item.url}" target="_blank" class="flex items-center gap-1.5 hover:text-black transition">
          ${getAutoIconSvg(item.label)}
          <span>${item.label}</span>
        </a>`
      ).join('');
    }

    loadDataFromSupabase();
  </script>
</body>
</html>
