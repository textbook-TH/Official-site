<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN PANEL - TEXTBOOK PLATFORM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; background-color: #ECECEC; color: #000000; }
    .card-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

  <!-- LOGIN BOX -->
  <div id="login-box" class="max-w-md w-full bg-white p-8 rounded-3xl card-shadow border border-gray-100 space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-black uppercase text-black">ADMIN LOGIN</h1>
      <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">ระบบจัดการแผงควบคุม TEXTBOOK.TH</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Email</label>
        <input type="text" id="login-email" inputmode="email" autocomplete="off" name="no-autofill-email" placeholder="admin@example.com" class="w-full px-4 py-3 bg-[#F9F9F9] border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Password</label>
        <input type="password" id="login-password" autocomplete="new-password" placeholder="••••••••" class="w-full px-4 py-3 bg-[#F9F9F9] border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black">
      </div>
      <button onclick="handleLogin()" class="w-full py-3 bg-black text-white rounded-xl text-xs font-bold tracking-widest uppercase hover:bg-gray-800 transition">
        เข้าสู่ระบบ
      </button>
      <p id="login-error" class="text-xs text-red-500 text-center font-bold hidden"></p>
    </div>
  </div>

  <!-- ADMIN DASHBOARD PANEL -->
  <div id="admin-dashboard" class="max-w-5xl w-full mx-auto hidden space-y-8 my-6">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-3xl card-shadow border border-gray-100 gap-4">
      <div>
        <span class="text-xs font-bold tracking-widest text-emerald-600 uppercase">● Admin Authenticated</span>
        <h1 class="text-2xl font-black uppercase text-black mt-1">แผงจัดการและอัปเดตข้อมูลหน้าหลัก</h1>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" target="_blank" class="px-5 py-3 border border-gray-300 rounded-full text-xs font-bold tracking-wider uppercase hover:bg-black hover:text-white transition">👁️ ดูหน้าเว็บจริง</a>
        <button onclick="saveAdminChanges()" class="px-6 py-3 bg-black text-white rounded-full text-xs font-bold tracking-widest uppercase hover:bg-gray-800 transition shadow-lg">
          💾 บันทึกลง Supabase
        </button>
        <button onclick="handleLogout()" class="px-4 py-3 border border-red-200 text-red-500 rounded-full text-xs font-bold hover:bg-red-50 transition">
          ออกจากระบบ
        </button>
      </div>
    </div>

    <!-- หัวข้อ 1: ลิงก์เมนูบาร์ -->
    <div class="bg-white p-6 md:p-8 rounded-3xl card-shadow border border-gray-100 space-y-6">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <div class="flex items-center gap-2">
          <span class="px-3 py-1 bg-black text-white rounded-xl font-bold text-xs">หัวข้อ 1</span>
          <h2 class="text-sm font-bold uppercase tracking-wider text-black">ลิงก์เมนูบาร์</h2>
        </div>
        <button onclick="addNavMenu()" class="px-4 py-2 bg-black text-white rounded-xl text-xs font-bold tracking-wider hover:bg-gray-800 transition">+ เพิ่มเมนูใหม่</button>
      </div>
      <input type="hidden" id="admin-logo-url">
      <input type="hidden" id="admin-logo-text">
      <div id="admin-nav-menu-list" class="space-y-3 pt-2"></div>
    </div>

    <!-- หัวข้อ 2: Hero Header -->
    <div class="bg-white p-6 md:p-8 rounded-3xl card-shadow border border-gray-100 space-y-6">
      <div class="flex items-center gap-2 border-b border-gray-100 pb-3">
        <span class="px-3 py-1 bg-black text-white rounded-xl font-bold text-xs">หัวข้อ 2</span>
        <h2 class="text-sm font-bold uppercase tracking-wider text-black">Hero Header (ส่วนบนสุด)</h2>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-2">ข้อความชื่อใหญ่ (Big Title Text)</label>
          <input type="text" id="admin-big-title" class="w-full px-4 py-3 bg-[#F9F9F9] border border-gray-200 rounded-xl text-sm font-bold">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-2">คำบรรยายสั้นใต้ชื่อใหญ่ (Subtext)</label>
          <input type="text" id="admin-subtext" class="w-full px-4 py-3 bg-[#F9F9F9] border border-gray-200 rounded-xl text-sm">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-gray-600 mb-2">🔗 ลิงก์รูปภาพตรงกลาง (Google Drive / Direct Image URL)</label>
        <input type="text" id="admin-img-url" class="w-full px-4 py-3 bg-[#F9F9F9] border border-gray-200 rounded-xl text-sm">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-2">หัวข้อสั้นด้านล่างรูปภาพ</label>
          <input type="text" id="admin-bottom-title" class="w-full px-4 py-3 bg-[#F9F9F9] border border-gray-200 rounded-xl text-sm font-bold">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-2">คำอธิบายใต้รูปภาพ</label>
          <textarea id="admin-desc-left" rows="2" class="w-full px-4 py-3 bg-[#F9F9F9] border border-gray-200 rounded-xl text-sm"></textarea>
        </div>
      </div>
    </div>

    <!-- หัวข้อ 3: ABOUT -->
    <div class="bg-white p-6 md:p-8 rounded-3xl card-shadow border border-gray-100 space-y-6">
      <div class="flex items-center gap-2 border-b border-gray-100 pb-3">
        <span class="px-3 py-1 bg-black text-white rounded-xl font-bold text-xs">หัวข้อ 3</span>
        <h2 class="text-sm font-bold uppercase tracking-wider text-black">ABOUT THE PLATFORM</h2>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="admin-about-title" placeholder="Main Title" class="px-4 py-3 bg-[#F9F9F9] rounded-xl text-sm font-bold border">
        <input type="text" id="admin-about-subtitle" placeholder="Subtitle" class="px-4 py-3 bg-[#F9F9F9] rounded-xl text-sm font-bold border">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <textarea id="admin-about-1" rows="4" placeholder="Left Text" class="px-4 py-3 bg-[#F9F9F9] rounded-xl text-sm border"></textarea>
        <textarea id="admin-about-2" rows="4" placeholder="Right Text" class="px-4 py-3 bg-[#F9F9F9] rounded-xl text-sm border"></textarea>
      </div>
    </div>

    <!-- หัวข้อ 4: SYSTEM COLLECTION -->
    <div class="bg-white p-6 md:p-8 rounded-3xl card-shadow border border-gray-100 space-y-6">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <div class="flex items-center gap-2">
          <span class="px-3 py-1 bg-black text-white rounded-xl font-bold text-xs">หัวข้อ 4</span>
          <h2 class="text-sm font-bold uppercase tracking-wider text-black">SYSTEM COLLECTION</h2>
        </div>
        <button onclick="addNewCard()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold tracking-wider hover:bg-emerald-700 transition">+ เพิ่มการ์ดใหม่</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="admin-system-title" placeholder="System Title" class="px-4 py-3 bg-[#F9F9F9] rounded-xl text-sm font-bold border">
        <input type="text" id="admin-system-subtitle" placeholder="System Subtitle" class="px-4 py-3 bg-[#F9F9F9] rounded-xl text-sm border">
      </div>
      <div id="admin-cards-list" class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2"></div>
    </div>

    <!-- หัวข้อ 5: FOOTER -->
    <div class="bg-white p-6 md:p-8 rounded-3xl card-shadow border border-gray-100 space-y-6">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <div class="flex items-center gap-2">
          <span class="px-3 py-1 bg-black text-white rounded-xl font-bold text-xs">หัวข้อ 5</span>
          <h2 class="text-sm font-bold uppercase tracking-wider text-black">FOOTER</h2>
        </div>
        <button onclick="addFooterLink()" class="px-4 py-2 bg-black text-white rounded-xl text-xs font-bold tracking-wider hover:bg-gray-800 transition">+ เพิ่มลิงก์ Footer</button>
      </div>
      <input type="text" id="admin-footer-copyright" placeholder="Copyright Text" class="w-full px-4 py-3 bg-[#F9F9F9] rounded-xl text-sm border font-bold">
      <div id="admin-footer-links-list" class="space-y-3 pt-2"></div>
    </div>

  </div>

  <script>
    // 🔗 ตั้งค่า Supabase Credentials (ปิดการจำ Session เพื่อให้หลุดออกจากระบบเมื่อกด F5 หรือปิดเบราว์เซอร์)
    const SUPABASE_URL = 'https://dvzzpuorytdvdawolken.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TK-m_pMcUSnq9h2Lf1T3bQ_bUrSpd4H';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: false
      }
    });

    // ล้างข้อมูล Session ออกทันทีเมื่อผู้ใช้กด F5, เปลี่ยนหน้า หรือปิดเบราว์เซอร์
    window.addEventListener('beforeunload', () => {
      supabaseClient.auth.signOut();
    });

    let navMenuItems = [];
    let systemCards = [];
    let footerLinks = [];

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        loadDataFromSupabase();
      } else {
        document.getElementById('login-box').classList.remove('hidden');
        document.getElementById('admin-dashboard').classList.add('hidden');
      }
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.innerText = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง!';
        errorEl.classList.remove('hidden');
      } else {
        errorEl.classList.add('hidden');
        checkAuth();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      checkAuth();
    }

    async function loadDataFromSupabase() {
      const { data } = await supabaseClient.from('site_config').select('content').eq('id', 1).single();
      if (!data || !data.content) return;

      const c = data.content;
      document.getElementById('admin-logo-url').value = c.logoUrl || '';
      document.getElementById('admin-logo-text').value = c.logoText || '';
      document.getElementById('admin-big-title').value = c.heroBigTitle || '';
      document.getElementById('admin-subtext').value = c.heroSubtext || '';
      document.getElementById('admin-img-url').value = c.heroImgUrl || '';
      document.getElementById('admin-bottom-title').value = c.heroBottomTitle || '';
      document.getElementById('admin-desc-left').value = c.heroDescLeft || '';

      document.getElementById('admin-about-title').value = c.aboutTitle || '';
      document.getElementById('admin-about-subtitle').value = c.aboutSubtitle || '';
      document.getElementById('admin-about-1').value = c.aboutText1 || '';
      document.getElementById('admin-about-2').value = c.aboutText2 || '';

      document.getElementById('admin-system-title').value = c.systemTitle || '';
      document.getElementById('admin-system-subtitle').value = c.systemSubtitle || '';

      document.getElementById('admin-footer-copyright').value = c.footerCopyright || '';

      navMenuItems = c.navMenuItems || [];
      systemCards = c.systemCards || [];
      footerLinks = c.footerLinks || [];

      renderAdminNavMenu();
      renderAdminCards();
      renderAdminFooterLinks();
    }

    // ฟังก์ชันอ่านค่าปัจจุบันจากหน้าจอลงในตัวแปร Array
    function syncNavMenuInputs() {
      navMenuItems.forEach((item, idx) => {
        const labelEl = document.getElementById(`admin-nav-label-${idx}`);
        const urlEl = document.getElementById(`admin-nav-url-${idx}`);
        if (labelEl) item.label = labelEl.value;
        if (urlEl) item.url = urlEl.value;
      });
    }

    function renderAdminNavMenu() {
      document.getElementById('admin-nav-menu-list').innerHTML = navMenuItems.map((item, idx) => `
        <div class="flex items-center gap-3 p-3 bg-[#F9F9F9] rounded-2xl border">
          <input type="text" id="admin-nav-label-${idx}" value="${item.label}" class="w-1/3 p-2 bg-white rounded-xl text-xs font-bold border">
          <input type="text" id="admin-nav-url-${idx}" value="${item.url}" class="w-2/3 p-2 bg-white rounded-xl text-xs border">
          <button onclick="removeNavMenu(${idx})" class="text-red-500 font-bold text-xs">✕ ลบ</button>
        </div>
      `).join('');
    }

    function addNavMenu() {
      syncNavMenuInputs();
      navMenuItems.push({ label: "NEW MENU", url: "#" });
      renderAdminNavMenu();
    }

    function removeNavMenu(idx) {
      syncNavMenuInputs();
      navMenuItems.splice(idx, 1);
      renderAdminNavMenu();
    }

    // ฟังก์ชันอ่านค่าการ์ดปัจจุบันลงตัวแปร Array
    function syncCardInputs() {
      systemCards.forEach((card, idx) => {
        const titleEl = document.getElementById(`admin-card-title-${idx}`);
        const descEl = document.getElementById(`admin-card-desc-${idx}`);
        const imgEl = document.getElementById(`admin-card-img-${idx}`);
        const iconEl = document.getElementById(`admin-card-icon-${idx}`);
        const linkEl = document.getElementById(`admin-card-link-${idx}`);
        if (titleEl) card.title = titleEl.value;
        if (descEl) card.desc = descEl.value;
        if (imgEl) card.imageUrl = imgEl.value;
        if (iconEl) card.iconText = iconEl.value;
        if (linkEl) card.link = linkEl.value;
      });
    }

    function renderAdminCards() {
      document.getElementById('admin-cards-list').innerHTML = systemCards.map((card, idx) => `
        <div class="p-4 bg-[#F9F9F9] rounded-2xl border space-y-2">
          <div class="flex justify-between">
            <span class="text-[10px] font-bold text-gray-400">Card #${idx + 1}</span>
            <button onclick="removeCard(${idx})" class="text-red-500 font-bold text-xs">✕ ลบ</button>
          </div>
          <input type="text" id="admin-card-title-${idx}" value="${card.title}" class="w-full p-2 bg-white rounded-lg text-xs font-bold border" placeholder="ชื่อการ์ด">
          <textarea id="admin-card-desc-${idx}" rows="2" class="w-full p-2 bg-white rounded-lg text-xs border" placeholder="คำอธิบาย">${card.desc}</textarea>
          <input type="text" id="admin-card-img-${idx}" value="${card.imageUrl || ''}" class="w-full p-2 bg-white rounded-lg text-xs border" placeholder="ลิงก์รูป (Drive/URL)">
          <input type="text" id="admin-card-icon-${idx}" value="${card.iconText || ''}" class="w-full p-2 bg-white rounded-lg text-xs border" placeholder="ข้อความแทนรูป">
          <input type="text" id="admin-card-link-${idx}" value="${card.link || ''}" class="w-full p-2 bg-white rounded-lg text-xs border" placeholder="ลิงก์ระบบ (เชื่อมต่อ URL อื่น)">
        </div>
      `).join('');
    }

    function addNewCard() {
      syncCardInputs();
      systemCards.push({ title: "New System", desc: "", imageUrl: "", iconText: "SYS", link: "" });
      renderAdminCards();
    }

    function removeCard(idx) {
      syncCardInputs();
      systemCards.splice(idx, 1);
      renderAdminCards();
    }

    // ฟังก์ชันอ่านค่า Footer ลิงก์ปัจจุบันลงตัวแปร Array
    function syncFooterInputs() {
      footerLinks.forEach((item, idx) => {
        const labelEl = document.getElementById(`admin-footer-label-${idx}`);
        const urlEl = document.getElementById(`admin-footer-url-${idx}`);
        if (labelEl) item.label = labelEl.value;
        if (urlEl) item.url = urlEl.value;
      });
    }

    function renderAdminFooterLinks() {
      document.getElementById('admin-footer-links-list').innerHTML = footerLinks.map((item, idx) => `
        <div class="flex items-center gap-3 p-3 bg-[#F9F9F9] rounded-2xl border">
          <input type="text" id="admin-footer-label-${idx}" value="${item.label}" class="w-1/3 p-2 bg-white rounded-xl text-xs font-bold border">
          <input type="text" id="admin-footer-url-${idx}" value="${item.url}" class="w-2/3 p-2 bg-white rounded-xl text-xs border">
          <button onclick="removeFooterLink(${idx})" class="text-red-500 font-bold text-xs">✕ ลบ</button>
        </div>
      `).join('');
    }

    function addFooterLink() {
      syncFooterInputs();
      footerLinks.push({ label: "NEW LINK", url: "#" });
      renderAdminFooterLinks();
    }

    function removeFooterLink(idx) {
      syncFooterInputs();
      footerLinks.splice(idx, 1);
      renderAdminFooterLinks();
    }

    // บันทึกข้อมูลกลับลง Supabase
    async function saveAdminChanges() {
      syncNavMenuInputs();
      syncCardInputs();
      syncFooterInputs();

      const updatedPayload = {
        logoUrl: document.getElementById('admin-logo-url').value,
        logoText: document.getElementById('admin-logo-text').value,
        navMenuItems: navMenuItems,
        heroBigTitle: document.getElementById('admin-big-title').value,
        heroSubtext: document.getElementById('admin-subtext').value,
        heroImgUrl: document.getElementById('admin-img-url').value,
        heroBottomTitle: document.getElementById('admin-bottom-title').value,
        heroDescLeft: document.getElementById('admin-desc-left').value,
        aboutTitle: document.getElementById('admin-about-title').value,
        aboutSubtitle: document.getElementById('admin-about-subtitle').value,
        aboutText1: document.getElementById('admin-about-1').value,
        aboutText2: document.getElementById('admin-about-2').value,
        systemTitle: document.getElementById('admin-system-title').value,
        systemSubtitle: document.getElementById('admin-system-subtitle').value,
        systemCards: systemCards,
        footerCopyright: document.getElementById('admin-footer-copyright').value,
        footerLinks: footerLinks
      };

      const { error } = await supabaseClient
        .from('site_config')
        .upsert({ id: 1, content: updatedPayload });

      if (error) {
        alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
      } else {
        alert('✅ บันทึกข้อมูลลง Supabase สำเร็จ! หน้าเว็บหลักจะอัปเดตทันที');
      }
    }

    checkAuth();
  </script>
</body>
</html>
